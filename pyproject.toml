[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netagent-lab"
version = "0.1.0"
description = "Independent network observability and agentic incident investigation research prototype."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "NetAgent Contributors" }
]
dependencies = [
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "networkx>=3,<4",
  "typer>=0.9,<1",
  "rich>=13,<15"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9"
]
llm = [
  "openai>=1.99,<3"
]
ui = [
  "streamlit>=1.35,<2"
]

[project.scripts]
netagent = "netagent_lab.cli:app"
nfmini = "netagent_lab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "live_openai: optional live OpenAI smoke tests skipped unless explicitly enabled"
]
