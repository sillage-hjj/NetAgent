acl_rules:
  - id: ACL-DENY-ZRH-APPB-HTTPS
    device: r3
    rule_name: BLOCK_ZURICH
    src_prefix: 10.1.0.0/24
    dst_prefix: 10.2.0.10/32
    protocol: tcp
    port: 443
    action: deny
  - id: ACL-ALLOW-APPB-DEFAULT
    device: r3
    rule_name: ALLOW_OTHER_APPB_HTTPS
    src_prefix: 10.0.0.0/8
    dst_prefix: 10.2.0.10/32
    protocol: tcp
    port: 443
    action: allow

